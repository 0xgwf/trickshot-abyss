name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Simulated runs must not crash
        run: |
          node tools/sim.ts 4 warrior none full boneyard
          node tools/sim.ts 2 emptynester snowy full snowy
